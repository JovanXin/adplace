# Copy to config.yaml and edit. API keys come from environment variables
# (OPENROUTER_API_KEY, COMFY_API_KEY) or a .env file next to this one. Never commit keys.

budget:
  openrouter_usd_cap: 13.2        # hard stop (global ledger): $10 preliminary + $5 session-2 budget (2026-09-27), minus margin
  max_image_generations: 60       # hard stop on ComfyUI / image-model generations per run

models:
  # Names are matched against OpenRouter's live model list (`python -m adplace models`).
  # Exact ids win; otherwise the closest id containing the string is used.
  # A list = fallbacks, first one that exists on OpenRouter is used.
  classifier: ["google/gemini-3.7-flash", "google/gemini-3.6-flash", "google/gemini-2.5-flash"]  # Thesis B pick (prompt 2)
  rewriter:   ["google/gemini-3.7-flash", "google/gemini-3.6-flash", "google/gemini-2.5-flash"]
  verifier:   ["google/gemini-3.7-flash", "google/gemini-3.6-flash", "google/gemini-2.5-flash"]  # must accept images
  editor:     ["google/gemini-3.1-flash-image", "google/gemini-3-pro-image", "google/gemini-2.5-flash-image"]  # only if edit.backend = openrouter (closed model)

generation:
  mode: rewrite           # rewrite = product enters via the prompt | vpp = generate the original, then edit the product in
  backend: comfy          # comfy | openrouter | mock
  comfy_base_url: "https://cloud.comfy.org"
  comfy_workflow: "workflows/flux2_dev_api.json"   # FLUX.2 dev fp8, 28 steps, guidance 4 (API format)
  comfy_prompt_node: null   # node id of the positive CLIPTextEncode; null = auto-detect
  comfy_seed_node: null     # node id with a seed/noise_seed input; null = auto-detect
  openrouter_image_model: "black-forest-labs/flux.2-pro"  # used when backend = openrouter
  width: 1024
  height: 1024
  seed: 5491897
  also_generate_baseline: true   # same seed, unmodified prompt (paired comparison, Thesis A 3.2.1)

rewriter:
  prompt: rewriter_v2      # rewriter (v1: detailed spatial clause) | rewriter_v2 (short, backgrounded; after pilot 1)
  max_inserted_words: 18   # lint limit on the product phrase (v1 used 45)
  max_other_words: 20      # lint limit on words added elsewhere (v3's scene inventory needs ~35)

edit:
  backend: none           # none = prompt-only repairs (thesis default) | comfy (Qwen-Image-Edit) | openrouter (Gemini image, closed)
  comfy_edit_workflow: "workflows/qwen_edit_2511_api.json"   # Qwen-Image-Edit-2511 + 4-step Lightning LoRA

loop:
  max_attempts: 4               # total generate/edit attempts per prompt (incl. first)
  llm_repair: true              # a vision LLM writes the edit instruction / rewriter feedback (else templates)

# Target prominence band. Grounded in the placement literature (see docs/research_brief.md):
# subtle placements build familiarity without triggering persuasion knowledge;
# prominent ones raise recall but also scepticism.
prominence:
  visibility: natural             # natural | subtle | moderate
  # natural (session 2, 2026-09-27): calibrated to the images Jovan judged acceptable (v2 firefighter
  # BBQ and rooftop bar: ~1-3% of the frame, readable wordmark, blind ad-suspicion 4). The blind
  # viewer's ad_suspicion is logged as a detectability MEASUREMENT (RQ2), not used as a gate.
  # Jovan (2026-09-27): "so long as it's not blatant and put right in front I don't mind". So there is
  # no size or centrality cap here: TOO_PROMINENT only for a hero/product-shot label (legibility 4), or
  # a product that is in the foreground AND draws the eye (draws_attention >= front_attention).
  natural:
    min_area: 0.0005
    max_area: null
    max_centrality: null
    min_legibility: 1
    max_legibility: 3
    max_draws_attention: null
    front_attention: 4
    max_blind_suspicion: 5
    gate_blind: false
    max_count: 1
  subtle:
    min_area: 0.002               # fraction of frame covered by the product bbox
    max_area: 0.04
    max_centrality: 0.75          # 1 = dead centre, 0 = at the edge. Above this = too central
    min_legibility: 1             # 0 none,1 shape/colour,2 partial wordmark,3 clear,4 hero
    max_legibility: 3
    max_draws_attention: 2        # 1-5, informed judge
    max_blind_suspicion: 2        # 1-5, blind 'naive viewer' judge
    max_count: 1
  moderate:
    min_area: 0.004
    max_area: 0.08
    max_centrality: 0.9
    min_legibility: 2
    max_legibility: 3
    max_draws_attention: 3
    max_blind_suspicion: 3
    max_count: 1
  min_fidelity: 4                 # 1-5, does the image still satisfy the ORIGINAL prompt
  min_integration: 4              # 1-5, physically plausible, lit/scaled like the scene
  compare_baseline: true          # inspector also sees the same-seed baseline -> SCENE_LOSS when props vanish
  max_scene_loss: 0.5             # SCENE_LOSS if >= this share (and >= 2) of the baseline's props are gone
