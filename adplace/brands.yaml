# Advertiser catalogue. Each brand lists the physical forms it can take in a scene,
# which contexts it fits, and the advertiser's own portrayal rules (the kind of
# conditions brands write into placement contracts, e.g. never with villains).
# `render_reliability` reflects Thesis A 4.2: famous marks render well, stylised ones don't.

coca-cola:
  display: Coca-Cola
  category: soft drink
  restricted: [hfss]            # UK Ofcom 9.13: HFSS placement banned in UK-made programmes
  render_reliability: high
  forms:
    - {form: "contour glass bottle", era: [vintage, 1950s, retro, any], cue: "red label with white script partly visible"}
    - {form: "red aluminium can", era: [modern, contemporary, any], cue: "red can, white script turned partly away"}
    - {form: "paper cup with red print", era: [modern], cue: "fountain cup, red print"}
    - {form: "enamel wall sign", era: [vintage, retro], cue: "small weathered red sign"}
    - {form: "red glass-front drinks fridge", era: [modern], cue: "small fridge behind counter"}
  fits: [picnic, bbq, beach, diner, cinema, party, road trip, convenience store, stadium, summer, casual meal, office break]
  avoid: [children as focal consumers, hospital, gym/fitness focus, fine dining, health]
  portrayal_rules:
    - never held or consumed by a child
    - never in a violent, criminal or tragic scene
    - not next to a competing soft-drink brand
  competitors: [pepsi]

